<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            transition: 0.3s;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background-color: #222;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #00bcd4;
        }

        /* Login */

        .login-btn {
            border: 1px solid #00bcd4;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .login-btn:hover {
            background-color: #00bcd4;
            color: white !important;
        }

        /* Register */

        .register-btn {
            background-color: #00bcd4;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .register-btn:hover {
            background-color: #0097a7;
            color: white !important;
        }

        /* ================= THEME BUTTON ================= */

        .theme-btn {
            border: 1px solid #00bcd4;
            background-color: transparent;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .theme-btn:hover {
            background-color: #00bcd4;
            color: white;
        }

        /* ================= CONTENT ================= */

        .content {
            padding: 80px 20px;
            text-align: center;
            transition: 0.3s;
        }

        .content h1 {
            color: #222;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .content p {
            color: #555;
            font-size: 18px;
            transition: 0.3s;
        }

        /* ================= DARK MODE ================= */

        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        body.dark-mode .navbar {
            background-color: #000;
        }

        body.dark-mode .content h1 {
            color: white;
        }

        body.dark-mode .content p {
            color: #ccc;
        }

    </style>

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Employee Management System
        </div>


        <ul class="nav-links">

            <li>
                <a href="/">
                    Home
                </a>
            </li>


            <li>
                <a href="/employee">
                    Employees
                </a>
            </li>


            <li>
                <a href="/add-employee">
                    Add Employee
                </a>
            </li>


            <li>
                <a href="/search">
                    Search
                </a>
            </li>


            <li>
                <a href="/login"
                   class="login-btn">
                    Login
                </a>
            </li>


            <li>
                <a href="/register"
                   class="register-btn">
                    Register
                </a>
            </li>


            <!-- THEME BUTTON -->

            <li>
                <button class="theme-btn"
                        id="themeToggle"
                        onclick="toggleTheme()">
                    🌙 Dark
                </button>
            </li>

        </ul>

    </nav>


    <!-- ================= HOME ================= -->

    <div class="content">

        <h1>
            Welcome to Employee Management System
        </h1>

        <p>
            Manage your employees easily.
        </p>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function toggleTheme() {

            document.body.classList.toggle("dark-mode");

            const button =
                document.getElementById("themeToggle");

            if (document.body.classList.contains("dark-mode")) {

                button.innerHTML = "☀️ Light";

                localStorage.setItem("theme", "dark");

            } else {

                button.innerHTML = "🌙 Dark";

                localStorage.setItem("theme", "light");

            }

        }


        /* Remember selected theme */

        window.onload = function () {

            const savedTheme =
                localStorage.getItem("theme");

            const button =
                document.getElementById("themeToggle");

            if (savedTheme === "dark") {

                document.body.classList.add("dark-mode");

                button.innerHTML = "☀️ Light";

            }

        };

    </script>


</body>

</html>
